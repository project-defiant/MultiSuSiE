[build-system]
requires = ['setuptools']
build-backend = "setuptools.build_meta"

[project]
name = 'MultiSuSiE'
authors = [
    {name = 'Jordan Rossen', email = 'jordanerossen@gmail.com'},
    {name = 'Omer Weissbrod', email = 'fake@fake.com'},
]
readme = 'README.md'
version='1.0'
requires-python = ">=3.11,<3.14"
dependencies = [
    'anndata>=0.11',
    'loguru>=0.7',
    'numba',
    'numpy',
    'polars>=1.0',
    'pydantic>=2.0',
    'scipy',
    'tqdm',
    'typer>=0.16'
]

[project.optional-dependencies]
test = [
    'pytest',
    'ruff',
    'black'
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Start with high-signal correctness checks and expand gradually.
select = ["E9", "F63", "F7", "F82"]

[project.scripts]
multisusie = "multisusie_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "plotnine>=0.15.7",
    "pytest>=8.0",
    "ruff>=0.11",
    "ty>=0.0.1",
]
